name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Production advisories fail this job; toolchain-only ones are reported.
      # The gate also fails when the audit could not be performed at all — it
      # used to read an unreachable registry as "no advisories" and pass.
      - name: Audit dependencies
        run: bun scripts/audit-check.ts
      - run: bun run lint
      # Build the widget bundle first — apps/web imports
      # packages/widget/dist/browser.js via Vite ?raw, so it must exist
      # before the web build runs.
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      # A server function the client graph never references is left out of the
      # generated manifest, so calling it 500s at request time and only in a
      # production build. Compare the built bundle's call sites against the
      # manifest while we still have the output.
      - run: bun run --cwd apps/web check:server-fn-manifest
      - run: bun run --filter @quackback/web typecheck
      - run: bun run --cwd packages/widget typecheck
      - run: bun run --cwd packages/widget test
      - run: bun run --cwd packages/db typecheck
      - run: bunx tsc --noEmit -p packages/email/tsconfig.json
      # `scripts/` was the only TypeScript nothing typechecked, and the
      # dependency-audit gate lives there.
      - run: bunx tsc --noEmit -p scripts/tsconfig.json

  # Four shards on four-core runners. The ~1,300-file suite was ~8–9 min of
  # wall clock on one job; splitting files is what makes the unit gate finish
  # in a couple of minutes.
  unit:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Declare the run complete: a suite whose database is missing or whose
      # schema is stale fails here instead of skipping itself. 120 suites guard
      # on the fixture's `available` flag, and `12 skipped` reads like success.
      REQUIRE_TEST_DB: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      # Drift only needs to run once; shard 1 owns it so the other three start
      # the suite immediately after migrate.
      - name: Check migration/schema drift
        if: matrix.shard == 1
        run: bun run db:check-drift
      # Coverage is collected here rather than in a run of its own, because a
      # shard only knows about the tests it ran: the diff-coverage gate merges
      # the four reports, and a line is covered when any shard executed it.
      # What is in scope is decided in vitest.config.ts, not by flags here.
      - name: Run the shard, collecting coverage
        run: >
          bun run test --run --shard=${{ matrix.shard }}/4
          --reporter=dot --reporter=github-actions
          --coverage.enabled --coverage.reporter=json
          --coverage.reportsDirectory=coverage/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}/coverage-final.json
          retention-days: 1

  # Single check name so existing "test" required-status wiring still matches.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All unit shards passed
        run: test "${{ needs.unit.result }}" = "success"

  # Every line this change added has to have been executed by a test. Judged on
  # the diff, not on the repository total: a 60%-covered repository is not an
  # argument for adding untested lines to it, and a 90% total is not an argument
  # that these particular lines were tested.
  diff-coverage:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the gate compares against the merge base, and a shallow
      # clone has no common commit to find.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: coverage
      # No `bun install`: the gate imports node built-ins and its own policy
      # module, nothing else.
      - name: Every added line has to have been executed
        env:
          DIFF_BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: bun scripts/diff-coverage-check.ts

  # The mutants of the code this change touched have to die. Only files the
  # manifest declares are graded, and a touched file without an entry is named
  # in the log rather than passed over, so the selection cannot shrink quietly.
  #
  # The budget is here rather than in the script so that raising it stands in a
  # diff. It is wall clock for the whole run and a different thing from
  # Stryker's per-mutant timeout: a mutant that hangs is a mutant the tests
  # caught, while an exceeded budget means nothing was measured, and the gate
  # fails as such.
  mutation:
    # A mutation score over a red suite is not a number. Stryker aborts in its
    # dry run when any test fails, so the gate reports "graded nothing" rather
    # than mistaking an unrun suite for hundreds of survivors (measured) — an
    # honest verdict, but a meaningless one, and it costs a 20-minute job to
    # reach. Waiting for `unit` also makes the ordering explicit: this gate
    # grades tests that pass.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the gate compares against the merge base, and a shallow
      # clone has no common commit to find.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # Unlike the coverage gate, this one runs a test runner, so it needs the
      # dependencies installed.
      - run: bun install --frozen-lockfile
      - name: Every mutant of the touched code has to be caught
        env:
          DIFF_BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          MUTATION_BUDGET_SECONDS: '900'
        run: bun scripts/mutation-check.ts

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-smoke-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # The seed workspace is served on the acme.localhost subdomain; make sure
      # Node-side fetches (Playwright request API, webServer readiness probe)
      # resolve it regardless of the runner's resolver.
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # The dev server loads env from the repo-root .env (bun --env-file) and
      # the e2e db-helpers spawn scripts through `dotenv -e ../../.env`, so
      # materialize one for CI.
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      # apps/web imports packages/widget/dist/browser.js via Vite ?raw — the
      # bundle must exist before the dev server starts.
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      # bunx re-resolves playwright from the registry and can hang for the
      # whole job timeout. Drive the workspace binary. Cache browsers so a
      # later run skips the CDN fetch. System deps (--with-deps / apt) are
      # best-effort: a stalled apt mirror must not fail the job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Start the app and run specs in one step. A separate step's shell
      # exit SIGHUPs `vite dev` on GHA (same lesson as live-api). Waiting
      # on /api/health/ready first avoids Playwright racing a Nitro 503.
      - name: Run @smoke e2e specs
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-e2e.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
          # Explicit spec files (not just the tag) so an unrelated spec with a
          # load-time error can't take the smoke gate down; the setup project
          # (admin auth) still runs as a project dependency, unfiltered.
          if ! (cd apps/web && ./node_modules/.bin/playwright test \
            tests/admin/inbox.spec.ts \
            tests/admin/workflows.spec.ts \
            tests/public/portal-support.spec.ts \
            tests/widget/messenger.spec.ts \
            --grep "@smoke"); then
            echo '===== server log (playwright failed) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: apps/web/blob-report
          retention-days: 7

  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      SECRET_KEY: live-api-secret-key-for-ci-only-at-least-32-characters
      BASE_URL: http://acme.localhost:3000
      API_BASE_URL: http://acme.localhost:3000/api/v1
      REQUIRE_LIVE_API: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map workspace hostname to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Write runtime environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - name: Provision CI API key
        run: |
          api_key=$(bun apps/web/scripts/create-ci-api-key.ts)
          echo "::add-mask::$api_key"
          echo "API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Start application and run live API assertions
        run: |
          # Bind every interface. Vite's default localhost is sometimes
          # IPv6-only while Node fetch of *.localhost uses 127.0.0.1.
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-live-api.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-live-api.log
            exit 1
          fi
          if ! (cd apps/web && bunx vitest run --config vitest.config.ts \
            src/lib/server/domains/api/__tests__/api-integration.test.ts); then
            echo '===== server log (vitest failed) ====='
            cat /tmp/quackback-live-api.log
            ss -lntp || true
            exit 1
          fi

  e2e-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-full-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - run: ./node_modules/.bin/playwright test
        working-directory: apps/web
